<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORYSORE — Web Storysore Player</title>
    <meta name="description" content="Pemutar musik untuk map Storysore.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-overlay"></div>
    <canvas id="fireflyCanvas" aria-hidden="true"></canvas>

    <div class="app-container">

        <header class="player-header">
            <h1 class="logo">Storysore</h1>
            <p class="tagline">Malam di sekitar api</p>

            <div class="now-playing">
                <span id="currentTitle">Pilih lagu untuk memutar...</span>
            </div>

            <canvas id="visualizer" aria-hidden="true"></canvas>

            <div class="progress-container">
                <span id="currentTime">00:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekSong()" aria-label="Posisi lagu">
                <span id="duration">00:00</span>
            </div>

            <div class="controls-row">
                <button class="control-btn" onclick="prevSong()" title="Lagu Sebelumnya" aria-label="Sebelumnya">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="control-btn play-btn" id="playPauseBtn" onclick="togglePlay()" title="Putar / Jeda" aria-label="Putar atau Jeda">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="control-btn" onclick="nextSong()" title="Lagu Selanjutnya" aria-label="Selanjutnya">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="control-btn" onclick="playRandomSong()" title="Putar Acak" aria-label="Putar Acak">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
            </div>

            <div class="options-row">
                <label class="toggle-option">
                    <input type="checkbox" id="autoplayToggle" checked>
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Autoplay</span>
                </label>

                <label class="toggle-option">
                    <input type="checkbox" id="fxToggle" checked onchange="toggleAudioFX()">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label"><i class="fa-solid fa-wand-magic-sparkles"></i> FX</span>
                </label>

                <div class="volume-row">
                    <i class="fa-solid fa-volume-high"></i>
                    <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.8" oninput="adjustMusicVolume()" aria-label="Volume musik">
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all', event)">Daftar Playlist</button>
            <button class="tab-btn" onclick="switchTab('queue', event)">Antrean<span class="queue-badge" id="queueBadge"></span></button>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Cari lagu atau penyanyi..." onkeyup="filterSongs()" aria-label="Cari lagu">
        </div>

        <div class="song-list" id="songList">
            </div>

    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Full Screen" class="control-btn" aria-label="Layar penuh">
        <i class="fa-solid fa-expand"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
