<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORYSORE - Web Storysore Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background GIF -->
    <div class="bg-overlay"></div>

    <!-- Main Player Box (Melayang di Kiri Layar) -->
    <div class="app-container">
        
        <!-- Header / Player Main Display -->
        <header class="player-header">
            <h1 class="logo">STORYSORE</h1>
            <div class="now-playing">
                <span id="currentTitle">Pilih lagu untuk memutar...</span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span id="currentTime">00:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekSong()">
                <span id="duration">00:00</span>
            </div>

            <!-- Controls (Tombol Play Lebih Panjang) -->
            <div class="controls">
                <button class="control-btn play-btn-wide" id="playPauseBtn" onclick="togglePlay()" title="Play / Pause">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="control-btn" id="nextBtn" onclick="nextSong()" title="Lagu Selanjutnya">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <!-- Autoplay & Volume Bar -->
            <div class="player-subsettings">
                <div class="autoplay-toggle">
                    <input type="checkbox" id="autoplayToggle" checked>
                    <label for="autoplayToggle">Autoplay Next</label>
                </div>
                <div class="volume-box">
                    <i class="fa-solid fa-music"></i>
                    <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.8" oninput="adjustMusicVolume()">
                </div>
            </div>
        </header>

        <!-- Ambient Sound Controls (Suara Awal 20%) -->
        <section class="ambient-controls">
            <div class="ambient-card">
                <div class="ambient-info">
                    <i class="fa-solid fa-water"></i>
                    <span>Ombak</span>
                </div>
                <div class="ambient-actions">
                    <input type="range" id="oceanVolume" min="0" max="1" step="0.01" value="0.2" oninput="adjustOceanVolume()">
                    <button class="ambient-btn" id="oceanToggleBtn" onclick="toggleOcean()">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>

            <div class="ambient-card">
                <div class="ambient-info">
                    <i class="fa-solid fa-fire"></i>
                    <span>Api Unggun</span>
                </div>
                <div class="ambient-actions">
                    <input type="range" id="campfireVolume" min="0" max="1" step="0.01" value="0.2" oninput="adjustCampfireVolume()">
                    <button class="ambient-btn" id="campfireToggleBtn" onclick="toggleCampfire()">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all')">Daftar Lagu</button>
            <button class="tab-btn" onclick="switchTab('favorites')">Favorit</button>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Cari lagu atau penyanyi..." onkeyup="filterSongs()">
        </div>

        <!-- Song List -->
        <div class="song-list" id="songList">
            <!-- Rendered by JS -->
        </div>

    </div>

    <!-- Hidden Audio Elements -->
    <audio id="audioPlayer" crossorigin="anonymous"></audio>
    <audio id="oceanPlayer" src="ocean.mp3" loop></audio>
    <audio id="campfirePlayer" src="campfire.mp3" loop></audio>

    <script src="script.js"></script>
<!-- Tombol Fullscreen (Bisa diletakkan di pojok kanan bawah area player) -->
<button id="fullscreenBtn" onclick="toggleFullscreen()" title="Full Screen" class="control-btn">
    <i class="fa-solid fa-expand"></i>
</button>
    
</body>
</html>
